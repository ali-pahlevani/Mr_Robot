# mrRobot: the hand and finger inertia tensors are those of boxes the size
# of their collision meshes (hand 0.057 x 0.168 x 0.085 m, finger 0.061 x
# 0.035 x 0.095 m), and the fingers weigh 0.10 kg. OpenFleX's values were
# 10-20x smaller than any solid of those dimensions can have, and ODE blew
# the arm apart twice when a 36 g finger with 2e-6 kg.m^2 met the microwave
# door under a 14 N.m motor.
hand:
  origin:
    x: 0.0
    y: 0.002
    z: 0.03
    roll: 0
    pitch: 0
    yaw: 0
  mass: 0.35
  inertia:
    xx: 1.03e-03
    yy: 3.05e-04
    zz: 9.18e-04
    xy: 0
    xz: 0
    yz: 0

left_finger:
  origin:
    x: 0.0064528
    y: 0.017020
    z: 0.0219685
    roll: 0
    pitch: 0
    yaw: 0
  mass: 0.10
  inertia:
    xx: 8.54e-05
    yy: 1.06e-04
    zz: 4.12e-05
    xy: 0
    xz: 0
    yz: 0

right_finger:
  origin:
    x: 0.0064528
    y: -0.017020
    z: 0.0219685
    roll: 0
    pitch: 0
    yaw: 0
  mass: 0.10
  inertia:
    xx: 8.54e-05
    yy: 1.06e-04
    zz: 4.12e-05
    xy: 0
    xz: 0
    yz: 0

