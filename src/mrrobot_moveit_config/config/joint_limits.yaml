# Velocity limits are OpenFleX's (joint_limits.yaml: 10.47 rad/s on every arm
# joint, 33 on the head, 0.1 m/s on the lift); accelerations are set here
# because the URDF has none and time parameterization needs them. Scaling 0.3
# by default: 10 rad/s is a real motor's limit, not a sensible planning speed
# for a jar; the mission slows the precise moves itself.
default_velocity_scaling_factor: 0.3
default_acceleration_scaling_factor: 0.3
joint_limits:
  # The column is only ever planned together with an arm (the *_arm_lift
  # groups, arms.reach) at the arm's scaling -- 0.4 free, 0.15 holding a jar
  # -- and MoveIt scales every joint by it. At 0.1 the column crawled at
  # 0.04 m/s beside a brisk arm; 0.25 x 0.4 is its motor's real 0.1 m/s.
  # Never plan the column at a scaling above 0.4: the motor cannot do more.
  lift_joint:
    has_velocity_limits: true
    max_velocity: 0.25
    has_acceleration_limits: true
    max_acceleration: 1.25
  openarmx_head_pitch_joint:
    has_velocity_limits: true
    max_velocity: 3.0
    has_acceleration_limits: true
    max_acceleration: 5.0
