# KDL for every chain: the OpenArmX arm is 7-DOF (redundant) and the *_lift
# chains 8-DOF, so a numeric solver with a generous timeout; the search
# resolution is fine enough for a 0.09 m jar. 0.2 s per IK call: at 0.05 the
# door grip (a thin feasible band) was missed one time in three (measured).
left_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.2
right_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.2
left_arm_lift:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.2
right_arm_lift:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.2
